<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOF_FINDEPT. - DJ Control Panel</title>
    <!-- Google Fonts: Sarabun -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0a0c10;
            --card-bg: #121620;
            --card-border: #1e2638;
            --army-gold: #fbbf24;
            --army-gold-glow: rgba(251, 191, 36, 0.3);
            --army-green: #10b981;
            --yt-red: #ff0000;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --font-main: 'Sarabun', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 85px;
            padding-bottom: 40px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(251, 191, 36, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.03) 0%, transparent 40%);
        }

        /* STICKY TOP HEADER */
        .sticky-header {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 80px;
            background: rgba(10, 12, 16, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            z-index: 1000;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .brand-section { display: flex; align-items: center; gap: 12px; }

        .brand-logo {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, #1f2937, #111827);
            border: 2px solid var(--army-gold);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: var(--army-gold); font-size: 1.2rem;
            box-shadow: 0 0 12px var(--army-gold-glow);
        }

        .brand-titles h1 {
            font-size: 1.2rem; font-weight: 700; color: var(--army-gold);
            letter-spacing: 1px; text-shadow: 0 0 8px var(--army-gold-glow);
            line-height: 1.2;
        }

        .brand-titles p { font-size: 0.82rem; color: var(--text-muted); }

        .header-clock-container {
            display: flex; align-items: center; gap: 10px;
            background: rgba(18, 22, 32, 0.8);
            border: 1px solid var(--card-border);
            padding: 6px 16px; border-radius: 12px;
        }

        .digital-clock {
            font-weight: 700; font-size: 1.4rem; color: #38bdf8;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
            line-height: 1;
        }

        .clock-blinker {
            animation: blink 1s infinite;
            display: inline-block;
            margin: 0 1px;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .main-container {
            max-width: 1200px; margin: 0 auto; width: 100%; padding: 1.2rem; flex: 1;
            display: grid; grid-template-columns: 420px 1fr; gap: 1.5rem;
        }

        @media (max-width: 992px) {
            .main-container { grid-template-columns: 1fr; }
        }

        .panel-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px; padding: 1.5rem;
            display: flex; flex-direction: column; gap: 1.2rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .card-header {
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--card-border); padding-bottom: 0.8rem;
        }

        .card-title {
            font-size: 1.1rem; font-weight: 600; color: var(--text-main);
            display: flex; align-items: center; gap: 10px;
        }

        .card-title i { color: var(--army-gold); }

        /* LEFT SIDE: YOUTUBE PLAYER & NOW PLAYING */
        .left-column { display: flex; flex-direction: column; gap: 1.5rem; }

        .player-wrapper {
            position: relative; width: 100%; padding-bottom: 56.25%;
            background: #000; border-radius: 12px; overflow: hidden;
            border: 1px solid var(--card-border);
        }

        .player-wrapper iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
        }

        .now-playing-box {
            background: rgba(10, 12, 16, 0.6);
            border: 1px solid var(--army-gold);
            border-radius: 12px; padding: 1rem;
            display: flex; flex-direction: column; gap: 8px;
        }

        .np-header { font-size: 0.85rem; color: var(--army-green); font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .np-song-title { font-size: 1.05rem; font-weight: 700; color: var(--army-gold); }
        .np-requester { font-size: 0.85rem; color: var(--text-muted); }
        .np-requester span { color: #38bdf8; font-weight: 600; }

        /* RIGHT SIDE: QUEUE LIST */
        .queue-container {
            display: flex; flex-direction: column; gap: 12px; max-height: 70vh; overflow-y: auto; padding-right: 4px;
        }

        .queue-item {
            background: rgba(10, 12, 16, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 12px; padding: 1rem;
            display: flex; align-items: center; gap: 1rem;
            transition: all 0.2s;
        }

        .queue-item:hover {
            border-color: rgba(251, 191, 36, 0.3);
            background: rgba(10, 12, 16, 0.8);
        }

        .queue-thumb {
            width: 60px; height: 60px; border-radius: 8px; object-fit: cover;
            border: 1px solid var(--card-border); flex-shrink: 0;
        }

        .queue-details {
            flex: 1; min-width: 0;
            display: flex; flex-direction: column; gap: 4px;
        }

        .queue-song-name {
            font-size: 1rem; font-weight: 700; color: var(--army-gold);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .queue-req-info {
            font-size: 0.85rem; color: var(--text-muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .queue-req-info span { color: #38bdf8; font-weight: 600; }

        .queue-message {
            font-size: 0.82rem; color: var(--text-main);
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 8px; border-radius: 6px;
            display: inline-block; width: fit-content;
            max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .queue-actions {
            display: flex; align-items: center; gap: 8px; flex-shrink: 0;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main); padding: 8px 12px; border-radius: 8px;
            font-family: var(--font-main); font-size: 0.85rem; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; gap: 6px;
            transition: all 0.2s;
        }

        .btn-play { background: rgba(16, 185, 129, 0.15); border-color: var(--army-green); color: var(--army-green); }
        .btn-play:hover { background: var(--army-green); color: #000; }

        .btn-delete { background: rgba(239, 68, 68, 0.15); border-color: #ef4444; color: #ef4444; }
        .btn-delete:hover { background: #ef4444; color: #fff; }

        .empty-state {
            text-align: center; padding: 3rem 1rem; color: var(--text-muted);
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }

        .empty-state i { font-size: 2.5rem; color: var(--card-border); }
    </style>
</head>
<body>

    <!-- STICKY TOP HEADER -->
    <header class="sticky-header">
        <div class="brand-section">
            <div class="brand-logo"><i class="fa-solid fa-sliders"></i></div>
            <div class="brand-titles">
                <h1>VOF_FINDEPT.</h1>
                <p>ระบบควบคุมดีเจ (DJ Control Panel)</p>
            </div>
        </div>

        <div class="header-clock-container">
            <i class="fa-regular fa-clock" style="color: #38bdf8; font-size: 0.9rem;"></i>
            <div class="digital-clock" id="digitalClock">00:00:00</div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="main-container">
        <!-- LEFT COLUMN: YOUTUBE PLAYER & NOW PLAYING -->
        <div class="left-column">
            <!-- YOUTUBE PLAYER CARD -->
            <section class="panel-card" style="padding: 1rem;">
                <div class="card-header" style="margin-bottom: 0.8rem;">
                    <div class="card-title" style="font-size: 1rem;"><i class="fa-brands fa-youtube" style="color: var(--yt-red);"></i> หน้าต่างเล่นเพลง (YouTube)</div>
                </div>
                <div class="player-wrapper">
                    <iframe id="youtubePlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
            </section>

            <!-- NOW PLAYING INFO CARD -->
            <section class="panel-card">
                <div class="card-header">
                    <div class="card-title" style="font-size: 1rem;"><i class="fa-solid fa-tower-broadcast"></i> กำลังออกอากาศ</div>
                </div>
                <div class="now-playing-box" id="nowPlayingBox">
                    <div class="np-header"><i class="fa-solid fa-circle-dot" style="animation: blink 1s infinite;"></i> กำลังเล่นอยู่</div>
                    <div class="np-song-title" id="npSongTitle">ยังไม่มีเพลงที่กำลังเล่น</div>
                    <div class="np-requester" id="npRequester">-</div>
                </div>
            </section>
        </div>

        <!-- RIGHT COLUMN: QUEUE LIST -->
        <div class="right-column">
            <section class="panel-card">
                <div class="card-header">
                    <div class="card-title">
                        <i class="fa-solid fa-list-check"></i> คิวเพลงที่รอเปิด (<span id="queueCount">0</span>)
                    </div>
                    <button onclick="fetchData()" class="btn-action">
                        <i class="fa-solid fa-rotate-right"></i> รีเฟรช
                    </button>
                </div>

                <div id="queueContainer" class="queue-container">
                    <div class="empty-state">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                        <span>กำลังโหลดคิวเพลง...</span>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        // *** ใส่ BIN_ID และ MASTER_KEY ของคุณตรงนี้ ***
        const BIN_ID = "6aad00b1ffd5d16053153d73"; 
        const API_KEY = "$2a$10$bcPn.WYet5wiqtzBHfh.q.v1EFFze6HGorl6dL7lpcgCzkY4nqUq.";

        let currentData = { queue: [], nowPlaying: null };

        document.addEventListener('DOMContentLoaded', () => {
            initClock();
            fetchData();
            setInterval(fetchData, 3000); // ดึงข้อมูลอัปเดตทุก 3 วินาที
        });

        function initClock() {
            const clockEl = document.getElementById('digitalClock');
            function updateTime() {
                const now = new Date();
                const hh = String(now.getHours()).padStart(2, '0');
                const mm = String(now.getMinutes()).padStart(2, '0');
                const ss = String(now.getSeconds()).padStart(2, '0');
                clockEl.innerHTML = `${hh}<span class="clock-blinker">:</span>${mm}<span class="clock-blinker">:</span>${ss}`;
            }
            updateTime();
            setInterval(updateTime, 1000);
        }

        async function fetchData() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                if (res.ok) {
                    const data = await res.json();
                    currentData = data.record || { queue: [], nowPlaying: null };
                    if (!currentData.queue) currentData.queue = [];
                    renderQueue();
                    renderDJNowPlaying();
                }
            } catch (err) {
                console.error("Error fetching data:", err);
            }
        }

        function renderQueue() {
            const container = document.getElementById('queueContainer');
            const queue = currentData.queue;
            document.getElementById('queueCount').innerText = queue.length;

            if (queue.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-regular fa-folder-open"></i>
                        <span>ยังไม่มีคิวเพลงในระบบตอนนี้</span>
                    </div>
                `;
                return;
            }

            container.innerHTML = queue.map((item, index) => `
                <div class="queue-item">
                    <img src="${item.thumbUrl}" class="queue-thumb" alt="Thumb">
                    <div class="queue-details">
                        <div class="queue-song-name">${item.songTitle} - ${item.artistName}</div>
                        <div class="queue-req-info">ขอโดย: <span>${item.reqName}</span> (${item.reqDept})</div>
                        <div class="queue-message"><i class="fa-solid fa-comment-dots" style="color: var(--army-gold);"></i> "${item.messageNote || '-'}"</div>
                    </div>
                    <div class="queue-actions">
                        <button class="btn-action btn-play" onclick="playSong(${index})">
                            <i class="fa-solid fa-play"></i> เล่นเพลงนี้
                        </button>
                        <button class="btn-action btn-delete" onclick="deleteSong(${index})">
                            <i class="fa-solid fa-trash"></i> ลบ
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderDJNowPlaying() {
            const np = currentData.nowPlaying;
            const titleEl = document.getElementById('npSongTitle');
            const reqEl = document.getElementById('npRequester');
            const playerEl = document.getElementById('youtubePlayer');

            if (np) {
                titleEl.innerText = `${np.songTitle} - ${np.artistName}`;
                reqEl.innerHTML = `ขอโดย: <span>${np.reqName}</span> (${np.reqDept}) | ฝากถึง DJ: "${np.messageNote || '-'}"`;
                if (np.videoId) {
                    playerEl.src = `https://www.youtube.com/embed/${np.videoId}?autoplay=1`;
                } else {
                    playerEl.src = "";
                }
            } else {
                titleEl.innerText = "ยังไม่มีเพลงที่กำลังเล่น";
                reqEl.innerHTML = "-";
                playerEl.src = "";
            }
        }

        // เมื่อ DJ กดเล่นเพลง -> ส่งข้อมูลไปอัปเดตช่อง nowPlaying ทั้งหน้า DJ และลิงก์ไปยังหน้าขอเพลงทันที
        async function playSong(index) {
            const songToPlay = currentData.queue[index];
            currentData.nowPlaying = songToPlay; // บันทึกเพลงที่กำลังเล่น
            currentData.queue.splice(index, 1); // เอาออกจากคิว

            await updateJSONBin();
        }

        async function deleteSong(index) {
            currentData.queue.splice(index, 1);
            await updateJSONBin();
        }

        async function updateJSONBin() {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(currentData)
                });
                renderQueue();
                renderDJNowPlaying();
            } catch (err) {
                alert("เกิดข้อผิดพลาดในการอัปเดตข้อมูล");
            }
        }
    </script>
</body>
</html>
