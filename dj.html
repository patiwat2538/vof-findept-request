<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOF_FINDEPT. - DJ Control Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0c10;
            --card-bg: #121620;
            --card-border: #1e2638;
            --army-gold: #fbbf24;
            --army-gold-glow: rgba(251, 191, 36, 0.3);
            --army-green: #10b981;
            --yt-red: #ff0000;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --font-main: 'Sarabun', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-top: 85px; padding-bottom: 40px;
        }

        .sticky-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 80px;
            background: rgba(10, 12, 16, 0.92); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border); z-index: 1000;
            display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem;
        }

        .brand-section { display: flex; align-items: center; gap: 12px; }
        .brand-logo {
            width: 44px; height: 44px; background: linear-gradient(135deg, #1f2937, #111827);
            border: 2px solid var(--army-gold); border-radius: 10px;
            display: flex; align-items: center; justify-content: center; color: var(--army-gold); font-size: 1.2rem;
        }
        .brand-titles h1 { font-size: 1.2rem; font-weight: 700; color: var(--army-gold); }
        .brand-titles p { font-size: 0.82rem; color: var(--text-muted); }

        .header-clock-container {
            display: flex; align-items: center; gap: 10px;
            background: rgba(18, 22, 32, 0.8); border: 1px solid var(--card-border);
            padding: 6px 16px; border-radius: 12px;
        }
        .digital-clock { font-weight: 700; font-size: 1.4rem; color: #38bdf8; letter-spacing: 2px; }

        .main-container { max-width: 900px; margin: 0 auto; padding: 1.2rem; }

        .panel-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem;
        }

        .card-header {
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--card-border); padding-bottom: 0.8rem; margin-bottom: 1rem;
        }
        .card-title { font-size: 1.1rem; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        .card-title i { color: var(--army-gold); }

        .now-playing-box {
            display: flex; gap: 1.5rem; background: rgba(10, 12, 16, 0.5);
            border: 1px solid var(--army-gold); padding: 1.2rem; border-radius: 12px;
            align-items: center;
        }
        .np-img { width: 90px; height: 90px; border-radius: 10px; object-fit: cover; }
        .np-details { flex: 1; }
        .np-title { font-size: 1.2rem; font-weight: 700; color: var(--army-gold); margin-bottom: 4px; }
        .np-meta { font-size: 0.9rem; color: #38bdf8; margin-bottom: 6px; }
        .np-note { font-size: 0.88rem; color: var(--text-muted); font-style: italic; }

        .queue-item {
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            background: rgba(10, 12, 16, 0.4); border: 1px solid var(--card-border);
            padding: 12px 16px; border-radius: 10px; margin-bottom: 10px;
        }
        .qi-thumb { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }
        .qi-info { flex: 1; }
        .qi-song { font-weight: 600; color: var(--text-main); }
        .qi-req { font-size: 0.82rem; color: var(--text-muted); }
        .qi-actions { display: flex; gap: 8px; }

        .btn-play { background: var(--army-green); color: #000; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; }
        .btn-delete { background: #ef4444; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
        .btn-clear-np { background: #6b7280; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.82rem; }
    </style>
</head>
<body>

    <header class="sticky-header">
        <div class="brand-section">
            <div class="brand-logo"><i class="fa-solid fa-sliders"></i></div>
            <div class="brand-titles">
                <h1>VOF_FINDEPT. (DJ PANEL)</h1>
                <p>ระบบควบคุมการเปิดเพลงสด</p>
            </div>
        </div>
        <div class="header-clock-container">
            <div class="digital-clock" id="digitalClock">00:00:00</div>
        </div>
    </header>

    <main class="main-container">
        <!-- NOW PLAYING SECTION -->
        <section class="panel-card">
            <div class="card-header">
                <div class="card-title"><i class="fa-solid fa-tower-broadcast"></i> เพลงที่กำลังออกอากาศสด</div>
                <button onclick="stopNowPlaying()" class="btn-clear-np"><i class="fa-solid fa-stop"></i> หยุดการเล่น</button>
            </div>
            <div id="nowPlayingContainer">
                <p style="color: var(--text-muted); text-align: center; padding: 1rem;">ยังไม่มีเพลงที่กำลังเล่นอยู่</p>
            </div>
        </section>

        <!-- QUEUE LIST SECTION -->
        <section class="panel-card">
            <div class="card-header">
                <div class="card-title"><i class="fa-solid fa-list-ol"></i> คิวเพลงที่ขอเข้ามา (<span id="queueCount">0</span>)</div>
                <button onclick="fetchQueue()" style="background:none; border:none; color:var(--army-gold); cursor:pointer;"><i class="fa-solid fa-rotate-right"></i> รีเฟรช</button>
            </div>
            <div id="queueListContainer">
                <p style="color: var(--text-muted); text-align: center; padding: 1rem;">กำลังโหลดคิวเพลง...</p>
            </div>
        </section>
    </main>

    <script>
        const BIN_ID = "6aad00b1ffd5d16053153d73"; 
        const API_KEY = "$2a$10$bcPn.WYet5wiqtzBHfh.q.v1EFFze6HGorl6dL7lpcgCzkY4nqUq.";

        let currentData = { queue: [], nowPlaying: null };

        document.addEventListener('DOMContentLoaded', () => {
            initClock();
            fetchQueue();
            setInterval(fetchQueue, 3000); // อัปเดตคิวและสถานะทุก 3 วินาที
        });

        function initClock() {
            const clockEl = document.getElementById('digitalClock');
            setInterval(() => {
                const now = new Date();
                clockEl.innerText = now.toTimeString().split(' ')[0];
            }, 1000);
        }

        async function fetchQueue() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                if (res.ok) {
                    const data = await res.json();
                    currentData = data.record || { queue: [], nowPlaying: null };
                    renderNowPlaying();
                    renderQueue();
                }
            } catch (err) {
                console.error("Error fetching queue:", err);
            }
        }

        function renderNowPlaying() {
            const container = document.getElementById('nowPlayingContainer');
            const np = currentData.nowPlaying;
            if (!np) {
                container.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 1rem;">ยังไม่มีเพลงที่กำลังเล่นอยู่</p>`;
                return;
            }

            container.innerHTML = `
                <div class="now-playing-box">
                    <img src="${np.thumbUrl}" class="np-img">
                    <div class="np-details">
                        <div class="np-title">${np.songTitle} - ${np.artistName}</div>
                        <div class="np-meta"><i class="fa-solid fa-user"></i> ขอโดย: ${np.reqName} (${np.reqDept})</div>
                        <div class="np-note">"${np.messageNote}"</div>
                    </div>
                    ${np.ytmUrl ? `<a href="${np.ytmUrl}" target="_blank" style="background:var(--yt-red); color:#fff; padding:8px 12px; border-radius:6px; text-decoration:none; font-size:0.85rem;"><i class="fa-brands fa-youtube"></i> เปิดใน YTM</a>` : ''}
                </div>
            `;
        }

        function renderQueue() {
            const container = document.getElementById('queueListContainer');
            const queue = currentData.queue || [];
            document.getElementById('queueCount').innerText = queue.length;

            if (queue.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 1rem;">ไม่มีรายการเพลงในคิว</p>`;
                return;
            }

            container.innerHTML = queue.map((item, index) => `
                <div class="queue-item">
                    <img src="${item.thumbUrl}" class="qi-thumb">
                    <div class="qi-info">
                        <div class="qi-song">${item.songTitle} - ${item.artistName}</div>
                        <div class="qi-req">ขอโดย: ${item.reqName} (${item.reqDept}) | ฝากถึง DJ: "${item.messageNote}"</div>
                    </div>
                    <div class="qi-actions">
                        <button class="btn-play" onclick="playSong(${index})"><i class="fa-solid fa-play"></i> เล่นเพลงนี้</button>
                        <button class="btn-delete" onclick="deleteSong(${index})"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        async function playSong(index) {
            const songToPlay = currentData.queue[index];
            currentData.nowPlaying = songToPlay;
            currentData.queue.splice(index, 1); // ลบออกจากคิวเมื่อกดเล่น
            await updateJSONBin();
        }

        async function stopNowPlaying() {
            currentData.nowPlaying = null;
            await updateJSONBin();
        }

        async function deleteSong(index) {
            currentData.queue.splice(index, 1);
            await updateJSONBin();
        }

        async function updateJSONBin() {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(currentData)
                });
                renderNowPlaying();
                renderQueue();
            } catch (err) {
                alert("เกิดข้อผิดพลาดในการอัปเดตข้อมูล");
            }
        }
    </script>
</body>
</html>
