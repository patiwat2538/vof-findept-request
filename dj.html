<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOF_FINDEPT. - DJ Control Panel</title>
    <!-- Google Fonts: Sarabun -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0a0c10;
            --card-bg: #121620;
            --card-border: #1e2638;
            --army-gold: #fbbf24;
            --army-gold-glow: rgba(251, 191, 36, 0.3);
            --army-green: #10b981;
            --yt-red: #ff0000;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --font-main: 'Sarabun', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 85px;
            padding-bottom: 40px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(251, 191, 36, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.03) 0%, transparent 40%);
        }

        /* STICKY TOP HEADER */
        .sticky-header {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 80px;
            background: rgba(10, 12, 16, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            z-index: 1000;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .brand-section { display: flex; align-items: center; gap: 12px; }

        .brand-logo {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, #1f2937, #111827);
            border: 2px solid var(--army-gold);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: var(--army-gold); font-size: 1.2rem;
            box-shadow: 0 0 12px var(--army-gold-glow);
        }

        .brand-titles h1 {
            font-size: 1.2rem; font-weight: 700; color: var(--army-gold);
            letter-spacing: 1px; text-shadow: 0 0 8px var(--army-gold-glow);
            line-height: 1.2;
        }

        .brand-titles p { font-size: 0.82rem; color: var(--text-muted); }

        .header-clock-container {
            display: flex; align-items: center; gap: 10px;
            background: rgba(18, 22, 32, 0.8);
            border: 1px solid var(--card-border);
            padding: 6px 16px; border-radius: 12px;
        }

        .digital-clock {
            font-weight: 700; font-size: 1.4rem; color: #38bdf8;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
            line-height: 1;
        }

        .clock-blinker {
            animation: blink 1s infinite;
            display: inline-block;
            margin: 0 1px;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .main-container {
            max-width: 1200px; margin: 0 auto; width: 100%; padding: 1.2rem; flex: 1;
            display: flex; flex-direction: column; gap: 1.5rem;
        }

        .panel-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px; padding: 1.5rem;
            display: flex; flex-direction: column; gap: 1.2rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .card-header {
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--card-border); padding-bottom: 0.8rem;
        }

        .card-title {
            font-size: 1.1rem; font-weight: 600; color: var(--text-main);
            display: flex; align-items: center; gap: 10px;
        }

        .card-title i { color: var(--army-gold); }

        /* DJ CONTROL SECTION */
        .dj-control-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 1rem;
            align-items: stretch;
        }

        @media (max-width: 992px) {
            .dj-control-grid { grid-template-columns: 1fr; }
        }

        .deck-box {
            background: rgba(10, 12, 16, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 12px; padding: 10px;
            display: flex; flex-direction: column; gap: 8px;
        }

        .deck-title-bar {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.85rem; font-weight: 700; color: var(--army-gold);
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }

        /* ใช้ div สำหรับ YouTube IFrame API ที่ควบคุมเสียงได้สมบูรณ์ */
        .player-wrapper div {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        .center-control-col {
            display: flex; flex-direction: column; gap: 1rem; justify-content: space-between;
        }

        /* NOW PLAYING INFO CARD */
        .now-playing-box {
            background: rgba(10, 12, 16, 0.6);
            border: 1px solid var(--army-gold);
            border-radius: 12px; padding: 1rem;
            display: flex; flex-direction: column; gap: 8px;
            flex: 1;
            justify-content: center;
        }

        .np-header { font-size: 0.85rem; color: var(--army-green); font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .np-song-title { font-size: 1.05rem; font-weight: 700; color: var(--army-gold); }
        .np-requester { font-size: 0.85rem; color: var(--text-muted); }
        .np-requester span { color: #38bdf8; font-weight: 600; }

        /* CROSSFADER CONTROLS */
        .crossfade-control-box {
            background: rgba(10, 12, 16, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 10px; padding: 10px;
            display: flex; flex-direction: column; gap: 8px;
        }

        .fader-slider {
            width: 100%; accent-color: var(--army-gold); cursor: pointer;
        }

        .fader-buttons {
            display: flex; gap: 8px;
        }

        .btn-fade {
            flex: 1; padding: 6px; font-size: 0.78rem; font-weight: 700; border-radius: 6px;
            cursor: pointer; border: 1px solid var(--card-border); background: rgba(255,255,255,0.05); color: var(--text-main);
            transition: all 0.2s;
        }
        .btn-fade:hover { background: var(--army-gold); color: #000; border-color: var(--army-gold); }

        /* QUEUE LIST: 2 COLUMNS */
        .queue-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        @media (max-width: 768px) {
            .queue-container { grid-template-columns: 1fr; }
        }

        .queue-item {
            background: rgba(10, 12, 16, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 12px; padding: 1rem;
            display: flex; align-items: center; gap: 1rem;
            transition: all 0.2s;
        }

        .queue-item:hover {
            border-color: rgba(251, 191, 36, 0.3);
            background: rgba(10, 12, 16, 0.8);
        }

        .queue-thumb {
            width: 60px; height: 60px; border-radius: 8px; object-fit: cover;
            border: 1px solid var(--card-border); flex-shrink: 0;
        }

        .queue-details {
            flex: 1; min-width: 0;
            display: flex; flex-direction: column; gap: 4px;
        }

        .queue-song-name {
            font-size: 1rem; font-weight: 700; color: var(--army-gold);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .queue-req-info {
            font-size: 0.85rem; color: var(--text-muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .queue-req-info span { color: #38bdf8; font-weight: 600; }

        .queue-message {
            font-size: 0.82rem; color: var(--text-main);
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 8px; border-radius: 6px;
            display: inline-block; width: fit-content;
            max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .queue-actions {
            display: flex; align-items: center; gap: 6px; flex-shrink: 0; flex-direction: column;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main); padding: 6px 10px; border-radius: 8px;
            font-family: var(--font-main); font-size: 0.78rem; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; gap: 4px;
            transition: all 0.2s; width: 100%; justify-content: center;
        }

        .btn-play-a { background: rgba(56, 189, 248, 0.15); border-color: #38bdf8; color: #38bdf8; }
        .btn-play-a:hover { background: #38bdf8; color: #000; }

        .btn-play-b { background: rgba(244, 63, 94, 0.15); border-color: #f43f5e; color: #f43f5e; }
        .btn-play-b:hover { background: #f43f5e; color: #fff; }

        .btn-delete { background: rgba(239, 68, 68, 0.15); border-color: #ef4444; color: #ef4444; }
        .btn-delete:hover { background: #ef4444; color: #fff; }

        .empty-state {
            grid-column: span 2;
            text-align: center; padding: 3rem 1rem; color: var(--text-muted);
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }

        .empty-state i { font-size: 2.5rem; color: var(--card-border); }
    </style>
</head>
<body>

    <!-- STICKY TOP HEADER -->
    <header class="sticky-header">
        <div class="brand-section">
            <div class="brand-logo"><i class="fa-solid fa-sliders"></i></div>
            <div class="brand-titles">
                <h1>VOF_FINDEPT.</h1>
                <p>ระบบควบคุมดีเจ (DJ Control Panel)</p>
            </div>
        </div>

        <div class="header-clock-container">
            <i class="fa-regular fa-clock" style="color: #38bdf8; font-size: 0.9rem;"></i>
            <div class="digital-clock" id="digitalClock">00:00:00</div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="main-container">
        
        <!-- TOP SECTION: DJ CONTROL PANEL (DECK A | NOW PLAYING & CROSSFADER | DECK B) -->
        <section class="panel-card" style="padding: 1rem;">
            <div class="card-header" style="margin-bottom: 0.8rem;">
                <div class="card-title" style="font-size: 1rem;"><i class="fa-brands fa-youtube" style="color: var(--yt-red);"></i> ชุดควบคุมการเล่นเพลง (YouTube API Decks & Crossfade)</div>
            </div>
            
            <div class="dj-control-grid">
                <!-- DECK A (LEFT) -->
                <div class="deck-box">
                    <div class="deck-title-bar">
                        <span><i class="fa-solid fa-compact-disc" style="color: #38bdf8;"></i> DECK A</span>
                        <span id="volA-text" style="color: #38bdf8; font-size: 0.78rem;">VOL: 100%</span>
                    </div>
                    <div class="player-wrapper">
                        <div id="playerA"></div>
                    </div>
                </div>

                <!-- CENTER COLUMN: NOW PLAYING & CROSSFADER -->
                <div class="center-control-col">
                    <!-- NOW PLAYING INFO -->
                    <div class="now-playing-box" id="nowPlayingBox">
                        <div class="np-header"><i class="fa-solid fa-circle-dot" style="animation: blink 1s infinite;"></i> กำลังออกอากาศ</div>
                        <div class="np-song-title" id="npSongTitle">ยังไม่มีเพลงที่กำลังเล่น</div>
                        <div class="np-requester" id="npRequester">-</div>
                    </div>

                    <!-- CROSSFADER CONTROLS -->
                    <div class="crossfade-control-box">
                        <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted);">
                            <span>DECK A</span>
                            <span style="color: var(--army-gold);">CROSSFADER</span>
                            <span>DECK B</span>
                        </div>
                        <input type="range" id="crossfader" class="fader-slider" min="0" max="100" value="0" oninput="handleCrossfader(this.value)">
                        <div class="fader-buttons">
                            <button class="btn-fade" onclick="autoFadeTo('A')"><i class="fa-solid fa-backward"></i> Fade A</button>
                            <button class="btn-fade" onclick="autoFadeTo('B')">Fade B <i class="fa-solid fa-forward"></i></button>
                        </div>
                    </div>
                </div>

                <!-- DECK B (RIGHT) -->
                <div class="deck-box">
                    <div class="deck-title-bar">
                        <span><i class="fa-solid fa-compact-disc" style="color: #f43f5e;"></i> DECK B</span>
                        <span id="volB-text" style="color: #f43f5e; font-size: 0.78rem;">VOL: 0%</span>
                    </div>
                    <div class="player-wrapper">
                        <div id="playerB"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- BOTTOM SECTION: QUEUE LIST (2 COLUMNS) -->
        <section class="panel-card">
            <div class="card-header">
                <div class="card-title">
                    <i class="fa-solid fa-list-check"></i> คิวเพลงที่รอเปิด (<span id="queueCount">0</span>)
                </div>
                <button onclick="fetchData()" class="btn-action" style="width: auto; padding: 6px 12px;">
                    <i class="fa-solid fa-rotate-right"></i> รีเฟรช
                </button>
            </div>

            <div id="queueContainer" class="queue-container">
                <div class="empty-state">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    <span>กำลังโหลดคิวเพลง...</span>
                </div>
            </div>
        </section>

    </main>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // *** ใส่ BIN_ID และ MASTER_KEY ของคุณตรงนี้ ***
        const BIN_ID = "6aad00b1ffd5d16053153d73"; 
        const API_KEY = "$2a$10$bcPn.WYet5wiqtzBHfh.q.v1EFFze6HGorl6dL7lpcgCzkY4nqUq.";

        let currentData = { queue: [], nowPlaying: null };
        let playerA, playerB;
        let isAPrepared = false, isBPrepared = false;
        let fadeTimer = null;

        // สร้าง YouTube Player ผ่าน API เพื่อให้ควบคุมเสียง (Volume) ได้จริง
        function onYouTubeIframeAPIReady() {
            playerA = new YT.Player('playerA', {
                height: '100%',
                width: '100%',
                playerVars: { 'autoplay': 0, 'controls': 1, 'enablejsapi': 1 },
                events: {
                    'onReady': () => { isAPrepared = true; playerA.setVolume(100); }
                }
            });

            playerB = new YT.Player('playerB', {
                height: '100%',
                width: '100%',
                playerVars: { 'autoplay': 0, 'controls': 1, 'enablejsapi': 1 },
                events: {
                    'onReady': () => { isBPrepared = true; playerB.setVolume(0); }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initClock();
            fetchData();
            setInterval(fetchData, 3000);
        });

        function initClock() {
            const clockEl = document.getElementById('digitalClock');
            function updateTime() {
                const now = new Date();
                const hh = String(now.getHours()).padStart(2, '0');
                const mm = String(now.getMinutes()).padStart(2, '0');
                const ss = String(now.getSeconds()).padStart(2, '0');
                clockEl.innerHTML = `${hh}<span class="clock-blinker">:</span>${mm}<span class="clock-blinker">:</span>${ss}`;
            }
            updateTime();
            setInterval(updateTime, 1000);
        }

        async function fetchData() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                if (res.ok) {
                    const data = await res.json();
                    currentData = data.record || { queue: [], nowPlaying: null };
                    if (!currentData.queue) currentData.queue = [];
                    renderQueue();
                    renderDJNowPlaying();
                }
            } catch (err) {
                console.error("Error fetching data:", err);
            }
        }

        function renderQueue() {
            const container = document.getElementById('queueContainer');
            const queue = currentData.queue;
            document.getElementById('queueCount').innerText = queue.length;

            if (queue.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-regular fa-folder-open"></i>
                        <span>ยังไม่มีคิวเพลงในระบบตอนนี้</span>
                    </div>
                `;
                return;
            }

            container.innerHTML = queue.map((item, index) => `
                <div class="queue-item">
                    <img src="${item.thumbUrl}" class="queue-thumb" alt="Thumb">
                    <div class="queue-details">
                        <div class="queue-song-name">${item.songTitle} - ${item.artistName}</div>
                        <div class="queue-req-info">ขอโดย: <span>${item.reqName}</span> (${item.reqDept})</div>
                        <div class="queue-message"><i class="fa-solid fa-comment-dots" style="color: var(--army-gold);"></i> "${item.messageNote || '-'}"</div>
                    </div>
                    <div class="queue-actions">
                        <button class="btn-action btn-play-a" onclick="playToDeck('A', ${index})">
                            <i class="fa-solid fa-play"></i> Deck A
                        </button>
                        <button class="btn-action btn-play-b" onclick="playToDeck('B', ${index})">
                            <i class="fa-solid fa-play"></i> Deck B
                        </button>
                        <button class="btn-action btn-delete" onclick="deleteSong(${index})">
                            <i class="fa-solid fa-trash"></i> ลบ
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderDJNowPlaying() {
            const np = currentData.nowPlaying;
            const titleEl = document.getElementById('npSongTitle');
            const reqEl = document.getElementById('npRequester');

            if (np) {
                titleEl.innerText = `${np.songTitle} - ${np.artistName}`;
                reqEl.innerHTML = `ขอโดย: <span>${np.reqName}</span> (${np.reqDept}) | ฝากถึง DJ: "${np.messageNote || '-'}"`;
            } else {
                titleEl.innerText = "ยังไม่มีเพลงที่กำลังเล่น";
                reqEl.innerHTML = "-";
            }
        }

        // กดส่งเพลงไป Deck A หรือ B ผ่าน API และสั่งเล่นอัตโนมัติ
        async function playToDeck(deck, index) {
            const songToPlay = currentData.queue[index];
            currentData.nowPlaying = songToPlay; 
            currentData.queue.splice(index, 1); 

            if (deck === 'A' && isAPrepared && songToPlay.videoId) {
                playerA.loadVideoById(songToPlay.videoId);
            } else if (deck === 'B' && isBPrepared && songToPlay.videoId) {
                playerB.loadVideoById(songToPlay.videoId);
            }

            await updateJSONBin();
        }

        // ฟังก์ชัน Crossfader ควบคุมเสียง Deck A และ B พร้อมกันผ่าน API
        function handleCrossfader(val) {
            const volB = parseInt(val);
            const volA = 100 - volB;

            if (isAPrepared && playerA.setVolume) {
                playerA.setVolume(volA);
            }
            if (isBPrepared && playerB.setVolume) {
                playerB.setVolume(volB);
            }

            document.getElementById('volA-text').innerText = `VOL: ${volA}%`;
            document.getElementById('volB-text').innerText = `VOL: ${volB}%`;
        }

        function autoFadeTo(targetDeck) {
            if (fadeTimer) clearInterval(fadeTimer);
            const fader = document.getElementById('crossfader');
            const targetVal = targetDeck === 'A' ? 0 : 100;

            fadeTimer = setInterval(() => {
                let currentVal = parseInt(fader.value);
                if (currentVal === targetVal) {
                    clearInterval(fadeTimer);
                    return;
                }
                if (targetVal > currentVal) currentVal += 2;
                else currentVal -= 2;

                fader.value = currentVal;
                handleCrossfader(currentVal);
            }, 50);
        }

        async function deleteSong(index) {
            currentData.queue.splice(index, 1);
            await updateJSONBin();
        }

        async function updateJSONBin() {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(currentData)
                });
                renderQueue();
                renderDJNowPlaying();
            } catch (err) {
                alert("เกิดข้อผิดพลาดในการอัปเดตข้อมูล");
            }
        }
    </script>
</body>
</html>
