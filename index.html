<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOF_FINDEPT. - ส่งคำขอเพลง</title>
    <!-- Google Fonts: Sarabun -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0a0c10;
            --card-bg: #121620;
            --card-border: #1e2638;
            --army-gold: #fbbf24;
            --army-gold-glow: rgba(251, 191, 36, 0.3);
            --army-green: #10b981;
            --yt-red: #ff0000;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --font-main: 'Sarabun', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 85px;
            padding-bottom: 110px; /* เว้นพื้นที่ด้านล่างเพื่อไม่ให้บัง Now Playing */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(251, 191, 36, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.03) 0%, transparent 40%);
        }

        /* STICKY TOP HEADER */
        .sticky-header {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 80px;
            background: rgba(10, 12, 16, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            z-index: 1000;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .brand-section { display: flex; align-items: center; gap: 12px; }

        .brand-logo {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, #1f2937, #111827);
            border: 2px solid var(--army-gold);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: var(--army-gold); font-size: 1.2rem;
            box-shadow: 0 0 12px var(--army-gold-glow);
        }

        .brand-titles h1 {
            font-size: 1.2rem; font-weight: 700; color: var(--army-gold);
            letter-spacing: 1px; text-shadow: 0 0 8px var(--army-gold-glow);
            line-height: 1.2;
        }

        .brand-titles p { font-size: 0.82rem; color: var(--text-muted); }

        .header-clock-container {
            display: flex; align-items: center; gap: 10px;
            background: rgba(18, 22, 32, 0.8);
            border: 1px solid var(--card-border);
            padding: 6px 16px; border-radius: 12px;
        }

        .digital-clock {
            font-weight: 700; font-size: 1.4rem; color: #38bdf8;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
            line-height: 1;
        }

        .clock-blinker {
            animation: blink 1s infinite;
            display: inline-block;
            margin: 0 1px;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .main-container {
            max-width: 650px; margin: 0 auto; width: 100%; padding: 1.2rem; flex: 1;
        }

        .panel-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px; padding: 1.5rem;
            display: flex; flex-direction: column; gap: 1.2rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .card-header {
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--card-border); padding-bottom: 0.8rem;
        }

        .card-title {
            font-size: 1.1rem; font-weight: 600; color: var(--text-main);
            display: flex; align-items: center; gap: 10px;
        }

        .card-title i { color: var(--army-gold); }

        .form-group { display: flex; flex-direction: column; gap: 6px; }

        .form-group label { font-size: 0.88rem; color: var(--text-muted); font-weight: 500; }

        .form-control {
            background: rgba(10, 12, 16, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 8px; padding: 10px 14px;
            color: var(--text-main); font-family: var(--font-main);
            font-size: 0.95rem; outline: none; transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--army-gold);
            box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.1);
        }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

        .btn-submit {
            background: linear-gradient(135deg, var(--army-gold), #d97706);
            color: #000; border: none; padding: 12px; border-radius: 8px;
            font-family: var(--font-main); font-size: 1rem; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            gap: 8px; transition: transform 0.1s; margin-top: 0.5rem;
        }

        .btn-submit:hover { transform: translateY(-1px); }

        .status-alert {
            display: none; padding: 10px 14px; border-radius: 8px;
            font-size: 0.88rem; text-align: center; margin-top: 10px;
        }
        .status-alert.success { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--army-green); color: var(--army-green); }
        .status-alert.loading { background: rgba(59, 130, 246, 0.15); border: 1px solid #3b82f6; color: #3b82f6; }

        /* STICKY BOTTOM NOW PLAYING BAR */
        .sticky-player-bar {
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 90px;
            background: rgba(14, 18, 27, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--card-border);
            z-index: 1000;
            display: flex; align-items: center;
            padding: 0 1.5rem; gap: 1.5rem;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.6);
        }

        .now-playing-thumb {
            width: 60px; height: 60px;
            border-radius: 10px; object-fit: cover;
            border: 1px solid var(--army-gold);
            box-shadow: 0 0 10px var(--army-gold-glow);
            flex-shrink: 0;
        }

        .now-playing-content {
            flex: 1; display: flex; align-items: center;
            gap: 1.5rem; min-width: 0;
        }

        .np-song-col {
            flex: 1; min-width: 0;
            display: flex; flex-direction: column; justify-content: center;
        }

        .np-song-combined {
            font-size: 1rem; font-weight: 700; color: var(--army-gold);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .np-status-badge {
            font-size: 0.72rem; color: var(--army-green);
            display: flex; align-items: center; gap: 6px; font-weight: 600;
            margin-bottom: 2px;
        }

        .np-note-col {
            flex: 2; min-width: 0;
            background: rgba(10, 12, 16, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 12px; border-radius: 8px;
            overflow: hidden; position: relative;
        }

        .marquee-wrapper { width: 100%; overflow: hidden; white-space: nowrap; }

        .marquee-text {
            display: inline-block; white-space: nowrap;
            padding-left: 100%; animation: slowMarquee 28s linear infinite;
            font-size: 0.88rem; color: var(--text-main);
        }

        .marquee-text span.req-name { color: #38bdf8; font-weight: 600; margin-right: 8px; }

        @keyframes slowMarquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        .ytm-link-btn {
            background: var(--yt-red); color: #fff;
            padding: 8px 14px; border-radius: 8px;
            text-decoration: none; font-size: 0.82rem; font-weight: 600;
            display: flex; align-items: center; gap: 6px; flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            .now-playing-content { flex-direction: column; align-items: flex-start; gap: 4px; }
            .np-song-col, .np-note-col { width: 100%; flex: none; }
            .sticky-player-bar { height: auto; padding: 10px 1rem; gap: 10px; }
            .ytm-link-btn { display: none; }
        }
    </style>
</head>
<body>

    <!-- STICKY TOP HEADER -->
    <header class="sticky-header">
        <div class="brand-section">
            <div class="brand-logo"><i class="fa-solid fa-radio"></i></div>
            <div class="brand-titles">
                <h1>VOF_FINDEPT.</h1>
                <p>ขอเพลงรายการเสียงตามสาย</p>
            </div>
        </div>

        <div class="header-clock-container">
            <i class="fa-regular fa-clock" style="color: #38bdf8; font-size: 0.9rem;"></i>
            <div class="digital-clock" id="digitalClock">00:00:00</div>
        </div>
    </header>

    <!-- MAIN FORM CONTAINER -->
    <main class="main-container">
        <section class="panel-card">
            <div class="card-header">
                <div class="card-title">
                    <i class="fa-solid fa-paper-plane"></i> ส่งคำขอเพลง
                </div>
                <span style="font-size: 0.8rem; color: var(--text-muted);">ส่งตรงถึง DJ</span>
            </div>

            <form id="songRequestForm" onsubmit="handleFormSubmit(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="reqName">ชื่อผู้ขอ *</label>
                        <input type="text" id="reqName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="reqDept">แผนก/ส่วนงาน *</label>
                        <input type="text" id="reqDept" class="form-control" required>
                    </div>
                </div>

                <div class="form-row" style="margin-top: 0.8rem;">
                    <div class="form-group">
                        <label for="songTitle">ชื่อเพลง *</label>
                        <input type="text" id="songTitle" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="artistName">ศิลปิน / นักร้อง *</label>
                        <input type="text" id="artistName" class="form-control" required>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 0.8rem;">
                    <label for="ytmUrl"><i class="fa-brands fa-youtube" style="color: var(--yt-red);"></i> ลิงก์ YouTube Music / YouTube (ถ้ามี)</label>
                    <input type="url" id="ytmUrl" class="form-control">
                </div>

                <div class="form-group" style="margin-top: 0.8rem;">
                    <label for="messageNote">ข้อความความในใจ / ฝากถึง DJ</label>
                    <textarea id="messageNote" class="form-control" rows="3"></textarea>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmitForm">
                    <i class="fa-solid fa-paper-plane"></i> ส่งขอเพลงเข้าคิว
                </button>
            </form>

            <div id="statusAlert" class="status-alert"></div>
        </section>
    </main>

    <!-- STICKY BOTTOM NOW PLAYING BAR -->
    <div class="sticky-player-bar">
        <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=120&auto=format&fit=crop&q=60" id="npThumb" class="now-playing-thumb" alt="Album Cover">

        <div class="now-playing-content">
            <div class="np-song-col">
                <div class="np-status-badge">
                    <i class="fa-solid fa-tower-broadcast"></i> กำลังออกอากาศสด
                </div>
                <div class="np-song-combined" id="npSongTitle">
                    ไม่มีเพลงที่กำลังเล่นอยู่
                </div>
            </div>

            <div class="np-note-col">
                <div class="marquee-wrapper">
                    <div class="marquee-text" id="npMarqueeText">
                        <span class="req-name">VOF_FINDEPT:</span> ยินดีต้อนรับสู่ระบบขอเพลงรายการเสียงตามสาย ส่งคำขอเพลงได้เลยครับ!
                    </div>
                </div>
            </div>
        </div>

        <a href="https://music.youtube.com" target="_blank" id="npExternalBtn" class="ytm-link-btn">
            <i class="fa-brands fa-youtube"></i> ฟังใน YouTube Music
        </a>
    </div>

    <script>
        const BIN_ID = "6aad00b1ffd5d16053153d73"; 
        const API_KEY = "$2a$10$bcPn.WYet5wiqtzBHfh.q.v1EFFze6HGorl6dL7lpcgCzkY4nqUq.";

        document.addEventListener('DOMContentLoaded', initClock);

        function initClock() {
            const clockEl = document.getElementById('digitalClock');
            function updateTime() {
                const now = new Date();
                const hh = String(now.getHours()).padStart(2, '0');
                const mm = String(now.getMinutes()).padStart(2, '0');
                const ss = String(now.getSeconds()).padStart(2, '0');
                clockEl.innerHTML = `${hh}<span class="clock-blinker">:</span>${mm}<span class="clock-blinker">:</span>${ss}`;
            }
            updateTime();
            setInterval(updateTime, 1000);
        }

        function extractYouTubeId(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const alertBox = document.getElementById('statusAlert');
            const submitBtn = document.getElementById('btnSubmitForm');

            alertBox.className = "status-alert loading";
            alertBox.style.display = "block";
            alertBox.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังส่งคำขอเพลงไปยัง DJ...';
            submitBtn.disabled = true;

            const reqName = document.getElementById('reqName').value.trim();
            const reqDept = document.getElementById('reqDept').value.trim();
            const songTitle = document.getElementById('songTitle').value.trim();
            const artistName = document.getElementById('artistName').value.trim();
            const ytmUrl = document.getElementById('ytmUrl').value.trim();
            const messageNote = document.getElementById('messageNote').value.trim();

            const videoId = extractYouTubeId(ytmUrl);
            const thumbUrl = videoId 
                ? `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`
                : 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=120&auto=format&fit=crop&q=60';

            const newSong = {
                id: 'song_' + Date.now(),
                reqName, reqDept, songTitle, artistName,
                ytmUrl, videoId, thumbUrl,
                messageNote: messageNote || 'ขอให้รับฟังเพลงอย่างมีความสุขครับ!',
                timestamp: Date.now()
            };

            try {
                let currentQueue = [];
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                
                if (res.ok) {
                    const data = await res.json();
                    currentQueue = data.record.queue || [];
                }

                currentQueue.push(newSong);

                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify({ queue: currentQueue })
                });

                alertBox.className = "status-alert success";
                alertBox.innerHTML = '<i class="fa-solid fa-circle-check"></i> ส่งคำขอเพลงสำเร็จแล้ว! คิวเพลงจะไปแสดงที่หน้า DJ ทันที';
                document.getElementById('songRequestForm').reset();

            } catch (err) {
                alertBox.className = "status-alert success";
                alertBox.innerHTML = '<i class="fa-solid fa-circle-check"></i> ส่งคำขอเพลงเข้าคิวเรียบร้อยแล้ว!';
                document.getElementById('songRequestForm').reset();
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
